name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cleanroom:
    name: F079 Cleanroom Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e calibrix
      - name: Cleanroom contamination + SPDX gate
        working-directory: calibrix
        # Machine-checkable provenance: any copyleft marker outside the
        # reviewed allowlist, or a missing SPDX grant, fails the build.
        run: python -m calibrix.studio.ledger scan

  tests:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e calibrix
      - name: Run all test suites
        working-directory: calibrix
        run: python -m unittest discover -s tests -v

  usecases:
    name: Use-Case Smoke (offline verticals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e calibrix
      - name: Run all 8 verticals from clean state
        run: |
          set -e
          for d in usecases/*/; do
            script=$(ls "$d" | grep -E '\.py$' | head -1)
            echo "::group::${d}"
            (cd "$d" && python "$script")
            echo "::endgroup::"
          done

  ledger:
    name: Architecture Ledger Build & Digest
    runs-on: ubuntu-latest
    needs: [cleanroom, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e calibrix
      - name: Build ledger from code
        working-directory: calibrix
        run: python -m calibrix.studio.ledger build
      - name: Verify ledger digest is reproducible
        working-directory: calibrix
        run: |
          d1=$(python -c "import json;print(json.load(open('docs/studio_ledger.json'))['build_digest'])")
          python -m calibrix.studio.ledger build --json-out /tmp/l2.json --md-out /tmp/l2.md >/dev/null
          d2=$(python -c "import json;print(json.load(open('/tmp/l2.json'))['build_digest'])")
          test "$d1" = "$d2" || { echo "::error::ledger digest not reproducible"; exit 1; }
          echo "digest $d1 reproducible"
      - name: Upload ledger artifacts
        uses: actions/upload-artifact@v4
        with:
          name: architecture-ledger
          path: |
            calibrix/docs/studio_ledger.json
            calibrix/docs/STUDIO_LEDGER.md
          if-no-files-found: error
