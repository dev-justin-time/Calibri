[package]
name = "calibrix-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Calibrix core math in Rust: kernel gains, spec parsing, Pareto, DE"

[lib]
name = "calibrix_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
